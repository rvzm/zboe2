<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ZBOE — Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{
      min-height: 100vh;
      background: radial-gradient(1000px 500px at 20% 0%, rgba(13,110,253,.15), transparent 60%),
                  radial-gradient(900px 500px at 80% 0%, rgba(25,135,84,.12), transparent 60%),
                  radial-gradient(1100px 600px at 50% 100%, rgba(13,110,253,.08), transparent 65%),
                  #0b0f14;
    }
    .soft-card{
      background: rgba(255,255,255,.03);
      border-color: rgba(255,255,255,.12);
    }
    .soft-card .card-header{
      background: rgba(255,255,255,.04);
      border-color: rgba(255,255,255,.12);
      color: #ffffff;
    }
    /* Bootstrap's .card-body/.card-footer default to a dark text color
       regardless of the page's dark theme — override or plain text (and
       form labels) go near-invisible on this background. */
    .soft-card .card-body, .soft-card .card-footer {
      color: rgba(255,255,255,.9);
    }
    .muted-mono{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      color: rgba(255,255,255,.65);
      font-size: .9rem;
    }
  </style>
</head>
<body class="text-light d-flex align-items-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-7 col-lg-5">

        <div class="text-center mb-3">
          <div class="display-6 fw-semibold">🧟 ZBOE</div>
          <div class="muted-mono">Register for the global hunt</div>
        </div>

        <div class="card soft-card shadow">
          <div class="card-header">
            <div class="fw-semibold">Create account</div>
            <div class="muted-mono">Pick a username and password — you're in</div>
          </div>
          <div class="card-body">
            <form method="post" action="/register" class="vstack gap-3">
              <div>
                <label class="form-label">Username</label>
                <input name="username" class="form-control" autocomplete="username" required />
                <div class="form-text text-light opacity-75">Letters/numbers/underscore recommended.</div>
              </div>

              <div>
                <label class="form-label">Password</label>
                <input name="password" type="password" class="form-control" autocomplete="new-password" required />
              </div>

              <div class="text-warning small" id="msg" style="display:none;"></div>

              <button class="btn btn-primary w-100" type="submit">Register</button>

              <a class="link-light small" href="/login">Back to login</a>
            </form>
          </div>
        </div>

        <div class="text-center mt-3 muted-mono">
          By registering, you agree to occasionally die and lose everything.
        </div>

      </div>
    </div>
  </div>

  <script>
    const p = new URLSearchParams(location.search);
    const err = p.get("err");
    if (err) {
      const el = document.getElementById("msg");
      el.style.display = "block";
      el.textContent = err;
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
